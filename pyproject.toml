[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemthermo"
version = "0.0.0"
description = "Chemical engineering thermodynamics utilities."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = [
  "nbstripout>=0.7.1",
  "pytest>=7.4",
  "ruff==0.14.13",
  "pyright>=1.1.350",
]
validation = [
  "thermo>=0.6.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chemthermo.data" = ["components.json"]
"chemthermo.parameters" = ["data/activity/nrtl.json"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  "database",
  "notebooks",
]

[tool.ruff.lint]
ignore = ["E501"]
extend-select = ["I"]
